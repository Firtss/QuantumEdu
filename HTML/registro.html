<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumEdu - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-center mb-4">
                    <a class="navbar-brand fw-bold fs-2 text-dark text-decoration-none" href="/">Quantum<span class="text-info">Edu</span></a>
                </div>
                
                <div class="card shadow-sm border-0 p-4 rounded-4">
                    <h3 class="fw-bold text-center mb-1">Crea tu Cuenta</h3>
                    <p class="text-muted text-center mb-4">Únete a la plataforma educativa</p>
                    
                    <form action="/procesar_registro" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control form-control-lg bg-light" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Correo Electrónico</label>
                            <input type="email" name="correo" class="form-control form-control-lg bg-light" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Contraseña</label>
                            <input type="password" name="password" class="form-control form-control-lg bg-light" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">Interés Principal (Comunidad Inicial)</label>
                            <select class="form-select form-select-lg bg-light" required>
                                <option value="" selected disabled>Selecciona un tema...</option>
                                <option>Computación Cuántica</option>
                                <option>Criptografía</option>
                                <option>Algoritmos</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-info text-white btn-lg w-100 fw-bold mb-3">Registrarme como Estudiante</button>
                    </form>
                    
                    <div class="text-center small">
                        ¿Ya tienes cuenta? <a href="login.html" class="text-info fw-bold text-decoration-none">Inicia Sesión aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();
            // Simula el registro exitoso
            alert("¡Cuenta creada exitosamente! Redirigiendo a tu perfil...");
            window.location.href = 'usuario.html';
        }
    </script>
</body>
</html>
