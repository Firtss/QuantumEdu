<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumEdu - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <a class="navbar-brand fw-bold fs-2 text-dark text-decoration-none" href="index.html">Quantum<span class="text-info">Edu</span></a>
                </div>
                
                <div class="card shadow-sm border-0 p-4 rounded-4">
                    <h3 class="fw-bold text-center mb-1">Bienvenido de nuevo</h3>
                    <p class="text-muted text-center mb-4">Ingresa tus credenciales para continuar</p>
                    
                    <form action="/procesar_login" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-muted">Correo Electrónico</label>
                            <input type="email" name="correo" id="emailInput" class="form-control form-control-lg bg-light" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold small text-muted">Contraseña</label>
                            <input type="password" name="password" class="form-control form-control-lg bg-light" required>
                        </div>
                        <button type="submit" class="btn btn-info text-white btn-lg w-100 fw-bold mb-3">Iniciar Sesión</button>
                    </form>
                    
                    <div class="text-center small">
                        ¿No tienes una cuenta? <a href="registro.html" class="text-info fw-bold text-decoration-none">Regístrate aquí</a>
                    </div>
                </div>
                
                <div class="text-center mt-4 text-muted small">
                    <p><strong>Tips de prueba de Roles:</strong><br>
                    Usa <code>user@mail.com</code> para Estudiante<br>
                    Usa <code>lider@mail.com</code> para Líder de Grupo<br>
                    Usa <code>admin@mail.com</code> para Administrador</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // Evita que recargue la página
            const email = document.getElementById('emailInput').value.toLowerCase();
            
            // Simulación de ruteo por base de datos
            if(email === 'admin@mail.com') {
                window.location.href = 'admin.html';
            } else if (email === 'lider@mail.com') {
                window.location.href = 'mis_foros.html'; // El líder aterriza en su panel
            } else {
                window.location.href = 'usuario.html'; // Estudiante regular
            }
        }
    </script>
</body>
</html>
